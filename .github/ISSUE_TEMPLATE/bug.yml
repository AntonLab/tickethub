name: Bug
description: Something does not work as specified
title: 'THUB-XXX '
labels: ['type:bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, in one sentence.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, commit or release.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Regression test added
        - [ ]
  - type: textarea
    id: meta
    attributes:
      label: Meta
      value: |
        Key: THUB-XXX · Type: Bug · Priority:  · SP:  · Epic:  · Milestone:  · Depends on:
    validations:
      required: true
