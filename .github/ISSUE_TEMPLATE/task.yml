name: Task
description: Technical or process work item
title: 'THUB-XXX '
labels: ['type:task']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done, in one sentence.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Scope, constraints, notes.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: '- [ ] '
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test cases
      description: Table of ID, Level, Given, When, Then.
      value: |
        | ID | Level | Given | When | Then |
        |---|---|---|---|---|
  - type: textarea
    id: meta
    attributes:
      label: Meta
      description: Key, Type, Priority, SP, Epic, Milestone, Depends on.
      value: |
        Key: THUB-XXX · Type: Task · Priority:  · SP:  · Epic:  · Milestone:  · Depends on:
    validations:
      required: true
